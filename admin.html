<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: 'AIzaSyBcXm5QQaYCCddVXNgGqTBAszdKEK-0PJQ',
      authDomain: 'multi-service-app-77dd8.firebaseapp.com',
      projectId: 'multi-service-app-77dd8',
      storageBucket: 'multi-service-app-77dd8.firebasestorage.app',
      messagingSenderId: '123732555482',
      appId: '1:123732555482:web:ea47c825e0dbb504f597e3',
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // SIMPLE PASSWORD
    const ADMIN_PASSWORD = "himanshu123";

    // CHECK LOGIN
    function checkLogin() {
      const saved = localStorage.getItem("adminLogged");

      if (saved === "true") {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadAdminWorks();
      }
    }

    // LOGIN FUNCTION
    window.loginAdmin = function () {
      const password = document.getElementById("password").value;

      if (password === ADMIN_PASSWORD) {
        localStorage.setItem("adminLogged", "true");

        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");

        loadAdminWorks();
      } else {
        alert("Wrong Password");
      }
    };

    // LOGOUT
    window.logoutAdmin = function () {
      localStorage.removeItem("adminLogged");
      location.reload();
    };

    // LOAD WORKS
    async function loadAdminWorks() {
      const workContainer = document.getElementById('adminWorks');

      workContainer.innerHTML = '';

      const querySnapshot = await getDocs(collection(db, 'works'));

      querySnapshot.forEach((docItem) => {
        const work = docItem.data();

        workContainer.innerHTML += `
          <div class="bg-gray-100 p-4 rounded-2xl flex justify-between items-center gap-4">

            <div>
              <h3 class="font-bold text-lg">
                ${work.title}
              </h3>

              <p class="text-sm text-gray-600 mt-1">
                ${work.description}
              </p>
            </div>

            <button
              onclick="deleteWork('${docItem.id}')"
              class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl"
            >
              Delete
            </button>

          </div>
        `;
      });
    }

    // DELETE WORK
    window.deleteWork = async function (id) {
      await deleteDoc(doc(db, 'works', id));
      loadAdminWorks();
    };

    // PAGE LOAD
    window.addEventListener('DOMContentLoaded', () => {

      checkLogin();

      document.getElementById('workForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const whatsapp = document.getElementById('whatsapp').value;

        await addDoc(collection(db, 'works'), {
          title,
          description,
          whatsapp,
        });

        document.getElementById('workForm').reset();

        loadAdminWorks();

        alert("Work Added Successfully");
      });
    });
  </script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- LOGIN PAGE -->
  <div
    id="loginPage"
    class="min-h-screen flex items-center justify-center p-6"
  >

    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">

      <h1 class="text-4xl font-bold text-center mb-2">
        Admin Login
      </h1>

      <p class="text-gray-500 text-center mb-6">
        Enter admin password
      </p>

      <input
        id="password"
        type="password"
        placeholder="Enter Password"
        class="w-full border p-4 rounded-2xl mb-4"
      />

      <button
        onclick="loginAdmin()"
        class="w-full bg-black text-white py-4 rounded-2xl font-semibold hover:bg-gray-800"
      >
        Login
      </button>

    </div>

  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <!-- HEADER -->
    <header class="bg-black text-white p-6 shadow-lg">

      <div class="max-w-5xl mx-auto flex justify-between items-center">

        <h1 class="text-4xl font-bold">
          Admin Dashboard
        </h1>

        <div class="flex gap-3">

          <a
            href="index.html"
            class="bg-green-500 hover:bg-green-600 px-5 py-3 rounded-2xl font-semibold"
          >
            Website
          </a>

          <button
            onclick="logoutAdmin()"
            class="bg-red-500 hover:bg-red-600 px-5 py-3 rounded-2xl font-semibold"
          >
            Logout
          </button>

        </div>

      </div>

    </header>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto p-6 grid lg:grid-cols-2 gap-6">

      <!-- ADD WORK -->
      <section class="bg-white p-6 rounded-3xl shadow-xl">

        <h2 class="text-3xl font-bold mb-5">
          Add New Work
        </h2>

        <form id="workForm" class="space-y-4">

          <input
            id="title"
            type="text"
            placeholder="Work Title"
            class="w-full border p-4 rounded-2xl"
            required
          />

          <textarea
            id="description"
            rows="5"
            placeholder="Work Description"
            class="w-full border p-4 rounded-2xl"
            required
          ></textarea>

          <input
            id="whatsapp"
            type="text"
            placeholder="WhatsApp Number"
            class="w-full border p-4 rounded-2xl"
            required
          />

          <button
            type="submit"
            class="w-full bg-black text-white py-4 rounded-2xl font-semibold hover:bg-gray-800"
          >
            Add Work
          </button>

        </form>

      </section>

      <!-- MANAGE -->
      <section class="bg-white p-6 rounded-3xl shadow-xl">

        <h2 class="text-3xl font-bold mb-5">
          Manage Works
        </h2>

        <div id="adminWorks" class="space-y-4"></div>

      </section>

    </main>

  </div>

</body>
</html>
